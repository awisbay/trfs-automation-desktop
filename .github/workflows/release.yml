name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build Windows executable and publish GitHub Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); import version; print(version.__version__)"
          $expectedTag = "v$version"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag '${{ github.ref_name }}' does not match src/version.py ('$expectedTag')."
          }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($version))\]" -Quiet)) {
            throw "CHANGELOG.md has no top-level entry for version $version."
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run automated tests
        shell: pwsh
        run: python -m unittest discover -s src -p "test_*.py"

      - name: Build NodeCraft
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean NodeCraft.spec

      - name: Name release artifact
        shell: pwsh
        run: |
          $source = "dist/NodeCraft.exe"
          $target = "dist/NodeCraft-$env:APP_VERSION-windows.exe"
          if (-not (Test-Path $source)) {
            throw "Expected build artifact was not produced: $source"
          }
          Move-Item -Path $source -Destination $target

      - name: Publish canonical GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/NodeCraft-$env:APP_VERSION-windows.exe" `
            --repo "${{ github.repository }}" `
            --title "NodeCraft v$env:APP_VERSION" `
            --generate-notes `
            --verify-tag
